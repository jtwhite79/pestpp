[pytest]
# collect test functions the way nose did: "test" at the start of the name or right after an
# underscore (basic_test, tenpar_fixed_test2, csv_tests). left to itself pytest only takes
# names that start with "test", which would skip nearly every benchmark
python_functions = test* Test* *_test* *_Test*
# dont leave a .pytest_cache behind in the source tree
addopts = -p no:cacheprovider
markers =
    own_job: left out when its file is run as a whole; runs only when named (file.py::name)
